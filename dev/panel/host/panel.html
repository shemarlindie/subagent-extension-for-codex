<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Delegated Work</title>
    <script>
      // ?now=<ms> freezes the clock before the panel loads, so the showcase's
      // elapsed times read the same in every capture. With &tick the clock
      // runs on from there, and setShowcaseNow(ms) moves it.
      (() => {
        const params = new URLSearchParams(location.search);
        let base = Number(params.get("now"));
        if (!base) return;
        const tick = params.has("tick");
        const RealDate = Date;
        let setAt = RealDate.now();
        const current = () => (tick ? base + RealDate.now() - setAt : base);

        window.Date = class extends RealDate {
          constructor(...args) {
            if (args.length) super(...args);
            else super(current());
          }

          static now() {
            return current();
          }
        };

        window.setShowcaseNow = (now) => {
          base = now;
          setAt = RealDate.now();
        };
      })();
    </script>
  </head>
  <body data-selected="false">
    <div id="root"></div>
    <script type="module" src="./panel.ts"></script>
  </body>
</html>
