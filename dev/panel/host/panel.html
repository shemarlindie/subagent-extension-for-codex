<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Delegated Work</title>
    <script>
      // ?now=<ms> freezes the clock before the panel loads, so the showcase's
      // elapsed times read the same in every capture.
      (() => {
        const now = Number(new URLSearchParams(location.search).get("now"));
        if (!now) return;
        const RealDate = Date;

        window.Date = class extends RealDate {
          constructor(...args) {
            if (args.length) super(...args);
            else super(now);
          }

          static now() {
            return now;
          }
        };
      })();
    </script>
  </head>
  <body data-selected="false">
    <div id="root"></div>
    <script type="module" src="./panel.ts"></script>
  </body>
</html>
