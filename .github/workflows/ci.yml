name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The marketplace install test installs the plugin with the Codex CLI,
      # pinned to the version the README says the install is tested with.
      - run: npm install --global @openai/codex@0.162.1
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      # pretest checks schemas, formatting and lint, then builds.
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore

  # Parts of the suite use POSIX shell fakes, so Windows runs the build and
  # packaging and settings-file tests until the rest is shown to run there.
  windows:
    name: Packaging (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --global @openai/codex@0.162.1
      - run: npm run build
      - run: npx vitest run tests/integration/package
      - run: npx vitest run src/service/features/settings/downloads-directory.test.ts src/service/features/settings/downloads-directory.integration.test.ts src/service/features/settings/settings-file.integration.test.ts
