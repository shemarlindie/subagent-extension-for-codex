name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    # The MACOS_RUNNER variable moves the macOS checks to a self-hosted runner.
    # The matrix value stays macos-latest so check names don't change.
    runs-on: ${{ matrix.os == 'macos-latest' && vars.MACOS_RUNNER || matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The marketplace install test installs the plugin with the Codex CLI,
      # pinned to the version the README says the install is tested with.
      - run: npm install --global @openai/codex@0.162.1
      - run: npx playwright install --with-deps chromium
      # npm test checks schemas, formatting, lint, types and unused code, and builds.
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore

  # Parts of the suite use POSIX shell fakes, so Windows runs the build and
  # packaging and settings-file tests until the rest is shown to run there.
  windows:
    name: Packaging (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --global @openai/codex@0.162.1
      - run: npm run build
      - run: npx vitest run tests/integration/package
      - run: npx vitest run src/service/features/settings/downloads-directory.test.ts src/service/features/settings/downloads-directory.integration.test.ts src/service/features/settings/settings-file.integration.test.ts

  # A pull request that changes the listed version may merge only once that
  # version is published. A release must be published from its head commit,
  # which the Release workflow tags v<version>. A rollback lists an earlier
  # version, whose tag only has to exist. Re-run this check after publishing.
  listed-version:
    name: Listed version published
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          listed() {
            git show "$1:.agents/plugins/marketplace.json" |
              node -p "JSON.parse(require('fs').readFileSync(0)).plugins[0].source.version"
          }
          git fetch -q --depth=1 origin "$BASE"
          version=$(listed "$HEAD")
          base=$(listed "$BASE" 2>/dev/null || true)
          if [ "$version" = "$base" ]; then
            echo "This pull request doesn't change the listed version"
            exit 0
          fi
          if ! git fetch -q --depth=1 origin "refs/tags/v${version}:refs/tags/v${version}"; then
            echo "v${version} isn't published yet" >&2
            exit 1
          fi
          newest=$(printf '%s\n' "$base" "$version" | sort -V | tail -n 1)
          if [ "$newest" = "$version" ] && [ "$(git rev-parse "v${version}^{commit}")" != "$HEAD" ]; then
            echo "v${version} isn't published from this commit. Run the Release workflow on this branch, then re-run this check." >&2
            exit 1
          fi
          echo "v${version} is published"
