name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The marketplace install test installs the plugin with the Codex CLI.
      - run: npm install --global @openai/codex
      - run: npm run typecheck
      # pretest checks schemas, formatting and lint, then builds.
      - run: npm test

  # Parts of the suite use POSIX shell fakes, so Windows runs the build and
  # the packaging tests until the rest is shown to run there.
  windows:
    name: Packaging (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --global @openai/codex
      - run: npm run build
      - run: npx vitest run tests/integration/package
