<svg
  xmlns="http://www.w3.org/2000/svg"
  width="64"
  height="64"
  viewBox="9 7.75 46 46"
  fill="currentColor"
  stroke="currentColor"
  role="img"
  aria-labelledby="glyph-title"
>
  <title id="glyph-title">Bot with orbiting dots</title>
  <style>
    :root {
      color: #353535;
    }

    .eyes {
      transform-box: fill-box;
      transform-origin: center;
    }

    @media (prefers-reduced-motion: no-preference) {
      .eyes {
        animation: blink 5s ease-in-out infinite;
      }

      @supports (offset-path: path("M0 0L1 1")) {
        .orbit-dot {
          transform: none;
          offset-path: path("M13 16a19 5.25 0 1 1 38 0a19 5.25 0 1 1-38 0");
          offset-rotate: 0deg;
          animation: orbit 8s linear infinite;
        }

        .orbit-dot:nth-child(2) {
          offset-distance: 35%;
          animation-delay: -2.8s;
        }

        .orbit-dot:nth-child(3) {
          offset-distance: 55%;
          animation-delay: -4.4s;
        }
      }
    }

    @keyframes orbit {
      from {
        offset-distance: 0%;
      }
      to {
        offset-distance: 100%;
      }
    }

    @keyframes blink {
      0%,
      91%,
      100% {
        transform: scaleY(1);
      }
      95% {
        transform: scaleY(0.1);
      }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color: #f5f5f5;
      }
    }
  </style>
  <g stroke="none">
    <!-- Keep the dots visible when motion styles are unavailable or disabled. -->
    <g class="orbit-dot" transform="translate(13 15)"><circle r="3" /></g>
    <g class="orbit-dot" transform="translate(44 11)"><circle r="2.5" /></g>
    <g class="orbit-dot" transform="translate(53 20)"><circle r="2" /></g>
  </g>
  <g
    fill="none"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <rect x="17" y="24" width="30" height="27" rx="9" />
    <path d="M32 18V24" />
    <path class="eyes" d="M25 36H28M36 36H39" />
  </g>
</svg>
